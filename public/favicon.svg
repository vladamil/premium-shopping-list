<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- The logo from the design: a dark circle with an orange map pin -->
  <circle cx="14" cy="14" r="14" fill="#12261F" />
  <!-- The pin is drawn in a 24×24 box, shrunk to 16×16 and moved to the middle.
       Its line is a bit thicker than in the design, so it stays visible at tab size. -->
  <g
    transform="translate(6 6) scale(0.6667)"
    fill="none"
    stroke="#FF8A4C"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z" />
    <circle cx="12" cy="10" r="2" />
  </g>
</svg>
